<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Mask Relay</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app" data-view="side">
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2 10c0-2.5 2.4-4 5-4h10c2.6 0 5 1.5 5 4 0 5-3.6 9-7.5 9-1.9 0-2.5-2-3.5-2s-1.6 2-3.5 2C3.6 19 2 15 2 10zm5.5 1.5a2 2 0 1 0 4 0 6 6 0 0 0-4 0zm9 0a6 6 0 0 0-4 0 2 2 0 1 0 4 0z"/></svg></div>
      <div><h1>Mask Relay</h1><p>Disposable addresses, zero trace</p></div>
      <button class="theme-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
    <div id="banner"></div>
    <div class="new-wrap">
      <button class="new-btn" id="newBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New mask <span class="kbd">N</span>
      </button>
      <form class="new-form" id="newForm" autocomplete="off">
        <input id="newLabel" maxlength="60" placeholder="What's it for? e.g. Spotify">
        <div class="hint">The label stays on this computer — it's never sent anywhere.</div>
        <div class="row">
          <button type="button" class="btn-ghost" id="newCancel">Cancel</button>
          <button type="submit" class="btn-primary" id="newSubmit">Create &amp; copy</button>
        </div>
      </form>
    </div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" placeholder="Search masks" aria-label="Search masks">
    </div>
    <div class="section-label"><span>Your masks</span><span id="maskCount"></span></div>
    <div class="masks" id="masks"></div>
    <div class="privacy">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6l-8-3z"/><path d="m9 12 2 2 4-4"/></svg>
      <div>Trackers &amp; remote images blocked. Your real address is never used.</div>
    </div>
  </aside>

  <section class="list" id="list"></section>
  <main class="reader" id="reader"></main>
</div>
<div class="toast-zone" id="toasts" aria-live="polite"></div>

<script src="core.js"></script>
<script src="platform.js"></script>
<script src="app.js"></script>
</body>
</html>
